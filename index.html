<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Tag Hub</title>
    <style>
        body { background: #0b0b0b; color: #00ff00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; overflow: hidden; }
        #header { padding: 10px; background: #1a1a1a; display: flex; flex-direction: column; gap: 5px; border-bottom: 1px solid #00ff00; }
        #search-container { display: flex; gap: 10px; }
        #search-input { flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; outline: none; }
        #search-results { max-height: 100px; overflow-y: auto; background: #111; display: none; border: 1px solid #333; }
        .search-item { padding: 8px; cursor: pointer; border-bottom: 1px solid #222; }
        .search-item:hover { background: #00ff00; color: #000; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; }
        #input-area { padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #333; }
        input[type="text"] { flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 12px; outline: none; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .msg { margin-bottom: 15px; padding: 10px; border: 1px solid #222; background: #161616; }
        .tag { color: #00ff00; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .filter-banner { padding: 10px; background: #003300; display: none; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

<div id="header">
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Type to search #hashtags...">
        <button onclick="clearFilter()">Reset</button>
    </div>
    <div id="search-results"></div>
</div>

<div id="filter-banner" class="filter-banner">
    <span id="filter-label"></span>
    <button onclick="clearFilter()" style="padding: 2px 10px;">Clear</button>
</div>

<div id="chat-box"></div>

<div id="input-area">
    <input type="text" id="msgInput" placeholder="Write message with #tags...">
    <button onclick="handleSend()">Post</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const _c = {
        apiKey: atob("QUl6YVN5QXd1SzJPX3YxbG8wWFZvLTlPekpiU1dJRkY2MXFqWTJB"),
        authDomain: atob("YmFuZ2xhZGVzaC00MjI1MS5maXJlYmFzZWFwcC5jb20="),
        databaseURL: atob("aHR0cHM6Ly9iYW5nbGFkZXNoLTQyMjUxLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
        projectId: atob("YmFuZ2xhZGVzaC00MjI1MQ=="),
        appId: atob("MToxNzU1OTIwNjY0NDI6d2ViOjI2Yjg0NDM1YzZlZWNmMGI5NjhjNzM=")
    };

    const app = initializeApp(_c);
    const db = getDatabase(app);
    let activeFilter = null;

    // Search Logic
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase();
        const tags = JSON.parse(localStorage.getItem('_permanent_tags')) || [];
        
        if (query.length > 0) {
            const matches = tags.filter(t => t.toLowerCase().includes(query));
            if (matches.length > 0) {
                searchResults.style.display = 'block';
                searchResults.innerHTML = matches.map(t => `<div class="search-item" onclick="applyFilter('${t}')">${t}</div>`).join('');
            } else {
                searchResults.style.display = 'none';
            }
        } else {
            searchResults.style.display = 'none';
        }
    });

    window.applyFilter = (tag) => {
        activeFilter = tag;
        searchInput.value = tag;
        searchResults.style.display = 'none';
        document.getElementById('filter-banner').style.display = 'flex';
        document.getElementById('filter-label').innerText = "Results for: " + tag;
        renderDisplay();
    };

    window.clearFilter = () => {
        activeFilter = null;
        searchInput.value = '';
        document.getElementById('filter-banner').style.display = 'none';
        renderDisplay();
    };

    // Message and Tag Core Logic
    const renderDisplay = () => {
        const now = Date.now();
        let logs = JSON.parse(localStorage.getItem('_msg_logs')) || [];
        const validLogs = logs.filter(m => m.exp > now);
        localStorage.setItem('_msg_logs', JSON.stringify(validLogs));

        let toShow = validLogs;
        if (activeFilter) {
            toShow = validLogs.filter(m => m.txt.includes(activeFilter));
        }

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = toShow.map(m => {
            const linkedText = m.txt.replace(/#\w+/g, (t) => `<span class="tag" onclick="applyFilter('${t}')">${t}</span>`);
            return `<div class="msg">${linkedText}</div>`;
        }).reverse().join('');
    };

    const saveData = (text) => {
        // Save Message (24h)
        let logs = JSON.parse(localStorage.getItem('_msg_logs')) || [];
        if (!logs.some(l => l.txt === text)) {
            logs.push({ txt: text, exp: Date.now() + 86400000 });
            localStorage.setItem('_msg_logs', JSON.stringify(logs));
        }

        // Save Tags (Permanent)
        const foundTags = text.match(/#\w+/g) || [];
        let pTags = JSON.parse(localStorage.getItem('_permanent_tags')) || [];
        let updatedPTags = [...new Set([...pTags, ...foundTags.slice(0, 10)])];
        localStorage.setItem('_permanent_tags', JSON.stringify(updatedPTags));
        
        renderDisplay();
    };

    window.handleSend = () => {
        const input = document.getElementById('msgInput');
        if (input.value.trim()) {
            push(ref(db, 'p2p_channel'), { m: input.value, ts: Date.now() });
            input.value = '';
        }
    };

    onValue(ref(db, 'p2p_channel'), (snap) => {
        const val = snap.val();
        if (val) Object.values(val).forEach(o => saveData(o.m));
    });

    renderDisplay();
</script>
</body>
</html>
