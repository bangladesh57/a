<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private P2P Hub</title>
    <style>
        body { background: #0f0f0f; color: #00ff00; font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; border-bottom: 1px solid #333; }
        #input-area { padding: 10px; display: flex; gap: 10px; background: #1a1a1a; }
        input { flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; outline: none; }
        button { background: #00ff00; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        .tag-folder { font-size: 0.8em; color: #888; padding: 5px; background: #222; margin-top: 5px; }
        .msg { margin-bottom: 10px; padding: 5px; border-left: 2px solid #00ff00; }
    </style>
</head>
<body>

<div id="chat-box"></div>
<div id="hashtag-display" class="tag-folder">Hashtags Saved: </div>
<div id="input-area">
    <input type="text" id="msgInput" placeholder="Type message (max 10 #tags)..." maxlength="500">
    <button onclick="handleSend()">Send</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    // Obfuscated Configuration
    const _0x4f2 = {
        apiKey: atob("QUl6YVN5QXd1SzJPX3YxbG8wWFZvLTlPekpiU1dJRkY2MXFqWTJB"),
        authDomain: atob("YmFuZ2xhZGVzaC00MjI1MS5maXJlYmFzZWFwcC5jb20="),
        databaseURL: atob("aHR0cHM6Ly9iYW5nbGFkZXNoLTQyMjUxLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
        projectId: atob("YmFuZ2xhZGVzaC00MjI1MQ=="),
        appId: atob("MToxNzU1OTIwNjY0NDI6d2ViOjI2Yjg0NDM1YzZlZWNmMGI5NjhjNzM=")
    };

    const app = initializeApp(_0x4f2);
    const db = getDatabase(app);

    const chatBox = document.getElementById('chat-box');
    const msgInput = document.getElementById('msgInput');
    const tagDisplay = document.getElementById('hashtag-display');

    // Permanent Hashtag Storage Logic
    const saveTags = (text) => {
        const tags = text.match(/#\w+/g) || [];
        let stored = JSON.parse(localStorage.getItem('_t_folder')) || [];
        let updated = [...new Set([...stored, ...tags.slice(0, 10)])];
        localStorage.setItem('_t_folder', JSON.stringify(updated));
        renderTags();
    };

    const renderTags = () => {
        const tags = JSON.parse(localStorage.getItem('_t_folder')) || [];
        tagDisplay.innerText = "Hashtags Folder: " + tags.join(' ');
    };

    // Ephemeral Message Storage (24h)
    const storeMsg = (text) => {
        const expiry = Date.now() + 86400000;
        let logs = JSON.parse(localStorage.getItem('_m_logs')) || [];
        logs.push({ t: text, e: expiry });
        localStorage.setItem('_m_logs', JSON.stringify(logs));
        saveTags(text);
        renderMsgs();
    };

    const renderMsgs = () => {
        const now = Date.now();
        let logs = JSON.parse(localStorage.getItem('_m_logs')) || [];
        const filtered = logs.filter(m => m.e > now);
        localStorage.setItem('_m_logs', JSON.stringify(filtered));
        
        chatBox.innerHTML = filtered.map(m => `<div class="msg">${m.t}</div>`).join('');
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    // Global send function
    window.handleSend = () => {
        const val = msgInput.value.trim();
        if(val) {
            push(ref(db, 'global_stream'), { m: val, ts: Date.now() });
            msgInput.value = '';
        }
    };

    // Listen for messages (Simulating P2P via RTDB for simple sync)
    onValue(ref(db, 'global_stream'), (snapshot) => {
        const data = snapshot.val();
        if(data) {
            const lastMsg = Object.values(data).pop();
            storeMsg(lastMsg.m);
        }
    });

    renderTags();
    renderMsgs();
    setInterval(renderMsgs, 60000); // Cleanup check every minute
</script>

</body>
</html>
