<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private P2P Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0b0b0b; color: #00ff00; font-family: 'Courier New', monospace; 
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        /* Fixed Header */
        header { 
            height: 60px; background: #1a1a1a; border-bottom: 2px solid #00ff00;
            display: flex; align-items: center; padding: 0 15px; flex-shrink: 0;
            z-index: 100; gap: 10px;
        }
        #search-input { 
            flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; 
            padding: 10px; outline: none; font-size: 14px;
        }

        /* Scrollable Middle Area */
        main { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 15px;
            scroll-behavior: smooth;
        }
        .msg-container {
            background: #161616; border: 1px solid #333; padding: 12px; border-radius: 5px;
        }
        .msg-tags { font-size: 0.8em; margin-bottom: 5px; display: flex; flex-wrap: wrap; gap: 5px; }
        .tag { color: #00ff00; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .tag:hover { color: #fff; }
        .msg-text { word-wrap: break-word; line-height: 1.4; color: #ccc; }

        /* Filter Banner */
        #filter-banner {
            background: #003300; padding: 5px 15px; font-size: 12px;
            display: none; justify-content: space-between; align-items: center;
        }

        /* Fixed Footer */
        footer { 
            height: 80px; background: #111; border-top: 2px solid #00ff00;
            display: flex; align-items: center; padding: 15px; flex-shrink: 0;
            gap: 10px; z-index: 100;
        }
        #msgInput { 
            flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; 
            padding: 12px; outline: none; font-size: 16px;
        }
        #sendBtn { 
            background: #00ff00; color: #000; border: none; padding: 0 20px; 
            cursor: pointer; font-weight: bold; height: 45px;
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #00ff00; border-radius: 10px; }
    </style>
</head>
<body>

<header>
    <input type="text" id="search-input" placeholder="Search #tags...">
    <button onclick="clearFilter()" style="background:#333; color:#fff; border:none; padding:8px; cursor:pointer;">Reset</button>
</header>

<div id="filter-banner">
    <span id="filter-label"></span>
    <span onclick="clearFilter()" style="cursor:pointer; color:red; font-weight:bold;">[X]</span>
</div>

<main id="chat-box"></main>

<footer>
    <input type="text" id="msgInput" placeholder="Message + #tags..." autocomplete="off">
    <button id="sendBtn" onclick="handleSend()">POST</button>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    // Encrypted Config
    const _0x = {
        apiKey: atob("QUl6YVN5QXd1SzJPX3YxbG8wWFZvLTlPekpiU1dJRkY2MXFqWTJB"),
        authDomain: atob("YmFuZ2xhZGVzaC00MjI1MS5maXJlYmFzZWFwcC5jb20="),
        databaseURL: atob("aHR0cHM6Ly9iYW5nbGFkZXNoLTQyMjUxLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
        projectId: atob("YmFuZ2xhZGVzaC00MjI1MQ=="),
        appId: atob("MToxNzU1OTIwNjY0NDI6d2ViOjI2Yjg0NDM1YzZlZWNmMGI5NjhjNzM=")
    };

    const app = initializeApp(_0x);
    const db = getDatabase(app);
    let activeFilter = null;

    const chatBox = document.getElementById('chat-box');
    const searchInput = document.getElementById('search-input');

    // Filter Logic
    window.applyFilter = (tag) => {
        activeFilter = tag.toLowerCase();
        document.getElementById('filter-banner').style.display = 'flex';
        document.getElementById('filter-label').innerText = "Filtering: " + tag;
        renderMessages();
    };

    window.clearFilter = () => {
        activeFilter = null;
        searchInput.value = '';
        document.getElementById('filter-banner').style.display = 'none';
        renderMessages();
    };

    // Search input event
    searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if(val) applyFilter(val); else clearFilter();
    });

    const renderMessages = () => {
        const now = Date.now();
        let logs = JSON.parse(localStorage.getItem('_p2p_msgs')) || [];
        
        // Auto-delete 24h old messages
        logs = logs.filter(m => m.exp > now);
        localStorage.setItem('_p2p_msgs', JSON.stringify(logs));

        let toShow = logs;
        if (activeFilter) {
            toShow = logs.filter(m => m.txt.toLowerCase().includes(activeFilter));
        }

        chatBox.innerHTML = toShow.map(m => {
            const tags = m.txt.match(/#\w+/g) || [];
            const tagHtml = tags.map(t => `<span class="tag" onclick="applyFilter('${t}')">${t}</span>`).join(' ');
            const cleanText = m.txt.replace(/#\w+/g, ''); // Hide tags from main text if preferred, or keep them.
            
            return `
                <div class="msg-container">
                    <div class="msg-tags">${tagHtml}</div>
                    <div class="msg-text">${m.txt}</div>
                </div>
            `;
        }).join('');
        
        // Auto scroll to bottom
        chatBox.scrollTop = chatBox.scrollHeight;
    };

    const processIncoming = (text) => {
        let logs = JSON.parse(localStorage.getItem('_p2p_msgs')) || [];
        if (!logs.some(l => l.txt === text)) {
            logs.push({ txt: text, exp: Date.now() + 86400000 });
            localStorage.setItem('_p2p_msgs', JSON.stringify(logs));
        }
        renderMessages();
    };

    window.handleSend = () => {
        const input = document.getElementById('msgInput');
        if (input.value.trim()) {
            push(ref(db, 'p2p_v3'), { m: input.value, ts: Date.now() });
            input.value = '';
        }
    };

    // Firebase listener
    onValue(ref(db, 'p2p_v3'), (snap) => {
        const data = snap.val();
        if (data) {
            Object.values(data).forEach(o => processIncoming(o.m));
        }
    });

    renderMessages();
</script>
</body>
</html>
