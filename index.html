<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Private P2P Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #0b0b0b; color: #00ff00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        
        /* Header & Search Area */
        #header { padding: 10px; background: #1a1a1a; border-bottom: 1px solid #00ff00; z-index: 100; }
        #search-container { display: flex; gap: 5px; }
        #search-input { flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 10px; outline: none; font-size: 14px; }
        #search-results { position: absolute; width: calc(100% - 20px); max-height: 150px; overflow-y: auto; background: #111; border: 1px solid #333; display: none; margin-top: 5px; z-index: 101; }
        .search-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #222; }
        .search-item:hover { background: #00ff00; color: #000; }

        /* Chat Display Area */
        #chat-box { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; padding-bottom: 100px; }
        .msg { padding: 12px; border: 1px solid #222; background: #161616; border-radius: 4px; line-height: 1.4; word-wrap: break-word; }
        .tag { color: #00ff00; text-decoration: underline; cursor: pointer; font-weight: bold; }
        
        /* Filter Banner */
        .filter-banner { padding: 8px; background: #003300; display: none; justify-content: space-between; align-items: center; font-size: 12px; }

        /* POST AREA (Fixed at bottom) */
        #input-area { position: fixed; bottom: 0; left: 0; right: 0; padding: 15px; background: #111; display: flex; gap: 10px; border-top: 1px solid #00ff00; z-index: 100; }
        #msgInput { flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; padding: 12px; outline: none; font-size: 16px; }
        #sendBtn { background: #00ff00; color: #000; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; font-size: 16px; height: 45px; }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #00ff00; }
    </style>
</head>
<body>

<div id="header">
    <div id="search-container">
        <input type="text" id="search-input" placeholder="Search #hashtags...">
        <button onclick="clearFilter()" style="background:#333; color:#fff; border:none; padding:5px 10px; cursor:pointer;">Reset</button>
    </div>
    <div id="search-results"></div>
</div>

<div id="filter-banner" class="filter-banner">
    <span id="filter-label"></span>
    <button onclick="clearFilter()" style="padding: 2px 10px; background:#f00; color:#fff; border:none;">Clear</button>
</div>

<div id="chat-box"></div>

<div id="input-area">
    <input type="text" id="msgInput" placeholder="Write message..." autocomplete="off">
    <button id="sendBtn" onclick="handleSend()">POST</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const _c = {
        apiKey: atob("QUl6YVN5QXd1SzJPX3YxbG8wWFZvLTlPekpiU1dJRkY2MXFqWTJB"),
        authDomain: atob("YmFuZ2xhZGVzaC00MjI1MS5maXJlYmFzZWFwcC5jb20="),
        databaseURL: atob("aHR0cHM6Ly9iYW5nbGFkZXNoLTQyMjUxLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
        projectId: atob("YmFuZ2xhZGVzaC00MjI1MQ=="),
        appId: atob("MToxNzU1OTIwNjY0NDI6d2ViOjI2Yjg0NDM1YzZlZWNmMGI5NjhjNzM=")
    };

    const app = initializeApp(_c);
    const db = getDatabase(app);
    let activeFilter = null;

    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');

    // Search functionality
    searchInput.addEventListener('input', () => {
        const query = searchInput.value.toLowerCase().trim();
        const tags = JSON.parse(localStorage.getItem('_perm_tags')) || [];
        
        if (query.length > 0) {
            const matches = tags.filter(t => t.toLowerCase().includes(query));
            if (matches.length > 0) {
                searchResults.style.display = 'block';
                searchResults.innerHTML = matches.map(t => `<div class="search-item" onclick="applyFilter('${t}')">${t}</div>`).join('');
            } else { searchResults.style.display = 'none'; }
        } else { searchResults.style.display = 'none'; }
    });

    window.applyFilter = (tag) => {
        activeFilter = tag;
        searchInput.value = tag;
        searchResults.style.display = 'none';
        document.getElementById('filter-banner').style.display = 'flex';
        document.getElementById('filter-label').innerText = "Viewing: " + tag;
        renderDisplay();
    };

    window.clearFilter = () => {
        activeFilter = null;
        searchInput.value = '';
        document.getElementById('filter-banner').style.display = 'none';
        renderDisplay();
    };

    const renderDisplay = () => {
        const now = Date.now();
        let logs = JSON.parse(localStorage.getItem('_msg_store')) || [];
        const validLogs = logs.filter(m => m.exp > now);
        localStorage.setItem('_msg_store', JSON.stringify(validLogs));

        let toShow = validLogs;
        if (activeFilter) {
            toShow = validLogs.filter(m => m.txt.includes(activeFilter));
        }

        const chatBox = document.getElementById('chat-box');
        chatBox.innerHTML = toShow.map(m => {
            const linkedText = m.txt.replace(/#\w+/g, (t) => `<span class="tag" onclick="applyFilter('${t}')">${t}</span>`);
            return `<div class="msg">${linkedText}</div>`;
        }).reverse().join('');
    };

    const processData = (text) => {
        // Local Save (24h)
        let logs = JSON.parse(localStorage.getItem('_msg_store')) || [];
        if (!logs.some(l => l.txt === text)) {
            logs.push({ txt: text, exp: Date.now() + 86400000 });
            localStorage.setItem('_msg_store', JSON.stringify(logs));
        }
        // Permanent Tags
        const tags = text.match(/#\w+/g) || [];
        let pTags = JSON.parse(localStorage.getItem('_perm_tags')) || [];
        let updated = [...new Set([...pTags, ...tags.slice(0, 10)])];
        localStorage.setItem('_perm_tags', JSON.stringify(updated));
        renderDisplay();
    };

    window.handleSend = () => {
        const input = document.getElementById('msgInput');
        if (input.value.trim()) {
            push(ref(db, 'chat_stream'), { m: input.value, ts: Date.now() });
            input.value = '';
        }
    };

    // Firebase Sync
    onValue(ref(db, 'chat_stream'), (snap) => {
        const val = snap.val();
        if (val) Object.values(val).forEach(o => processData(o.m));
    });

    renderDisplay();
</script>
</body>
</html>
