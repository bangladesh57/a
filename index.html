<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Private P2P Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0b0b0b; color: #00ff00; font-family: 'Courier New', monospace; 
            margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        #top-fixed-section {
            display: flex; flex-direction: column; background: #1a1a1a;
            border-bottom: 2px solid #00ff00; z-index: 1000; flex-shrink: 0;
        }

        .search-row, .post-row { display: flex; padding: 10px; gap: 10px; }
        .search-row { border-bottom: 1px solid #333; }
        
        #search-input, #msgInput { 
            flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; 
            padding: 10px; outline: none; font-size: 15px; border-radius: 4px;
        }

        #sendBtn { 
            background: #00ff00; color: #000; border: none; padding: 0 20px; 
            cursor: pointer; font-weight: bold; border-radius: 4px;
        }

        main { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 15px;
            background: #0b0b0b;
        }
        
        .msg-container {
            background: #161616; border: 1px solid #333; padding: 12px; border-radius: 5px;
        }
        .tag-row { font-size: 0.8em; margin-bottom: 5px; display: flex; flex-wrap: wrap; gap: 6px; }
        .tag { color: #00ff00; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .msg-text { word-wrap: break-word; line-height: 1.4; color: #ccc; white-space: pre-wrap; }

        #filter-banner {
            background: #003300; padding: 5px 15px; font-size: 12px;
            display: none; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<div id="top-fixed-section">
    <div class="search-row">
        <input type="text" id="search-input" placeholder="Search #tags...">
        <button onclick="clearFilter()" style="background:#444; color:#fff; border:none; padding:5px 10px; cursor:pointer;">Reset</button>
    </div>
    
    <div class="post-row">
        <input type="text" id="msgInput" placeholder="Write message + #tags..." autocomplete="off">
        <button id="sendBtn" onclick="handleSend()">POST</button>
    </div>

    <div id="filter-banner">
        <span id="filter-label"></span>
        <span onclick="clearFilter()" style="cursor:pointer; color:red; font-weight:bold; padding:5px;">[X]</span>
    </div>
</div>

<main id="chat-box"></main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const _fb = {
        apiKey: atob("QUl6YVN5QXd1SzJPX3YxbG8wWFZvLTlPekpiU1dJRkY2MXFqWTJB"),
        authDomain: atob("YmFuZ2xhZGVzaC00MjI1MS5maXJlYmFzZWFwcC5jb20="),
        databaseURL: atob("aHR0cHM6Ly9iYW5nbGFkZXNoLTQyMjUxLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
        projectId: atob("YmFuZ2xhZGVzaC00MjI1MQ=="),
        appId: atob("MToxNzU1OTIwNjY0NDI6d2ViOjI2Yjg0NDM1YzZlZWNmMGI5NjhjNzM=")
    };

    const app = initializeApp(_fb);
    const db = getDatabase(app);
    let activeTag = null;

    const chatBox = document.getElementById('chat-box');
    const searchInput = document.getElementById('search-input');

    // Function to prevent code execution (HTML Escape)
    const escapeHTML = (str) => {
        const p = document.createElement('p');
        p.textContent = str;
        return p.innerHTML;
    };

    window.applyFilter = (tag) => {
        activeTag = tag.toLowerCase();
        document.getElementById('filter-banner').style.display = 'flex';
        document.getElementById('filter-label').innerText = "Filter: " + tag;
        renderUI();
    };

    window.clearFilter = () => {
        activeTag = null;
        searchInput.value = '';
        document.getElementById('filter-banner').style.display = 'none';
        renderUI();
    };

    searchInput.addEventListener('input', (e) => {
        const val = e.target.value.trim();
        if(val) applyFilter(val); else clearFilter();
    });

    const renderUI = () => {
        const now = Date.now();
        let logs = JSON.parse(localStorage.getItem('_v7_db')) || [];
        logs = logs.filter(m => m.exp > now);
        localStorage.setItem('_v7_db', JSON.stringify(logs));

        let toDisplay = logs;
        if (activeTag) {
            toDisplay = logs.filter(m => m.txt.toLowerCase().includes(activeTag));
        }

        const sorted = toDisplay.sort((a, b) => b.ts - a.ts);

        chatBox.innerHTML = sorted.map(m => {
            const safeText = escapeHTML(m.txt);
            const tags = safeText.match(/#\w+/g) || [];
            const tagHtml = tags.map(t => `<span class="tag" onclick="applyFilter('${t}')">${t}</span>`).join(' ');
            return `
                <div class="msg-container">
                    <div class="tag-row">${tagHtml}</div>
                    <div class="msg-text">${safeText}</div>
                </div>
            `;
        }).join('');
    };

    const processSync = (text, time) => {
        let logs = JSON.parse(localStorage.getItem('_v7_db')) || [];
        if (!logs.some(l => l.txt === text && Math.abs(l.ts - time) < 1000)) {
            logs.push({ txt: text, ts: time, exp: Date.now() + 86400000 });
            localStorage.setItem('_v7_db', JSON.stringify(logs));
        }
        renderUI();
    };

    window.handleSend = () => {
        const input = document.getElementById('msgInput');
        if (input.value.trim()) {
            push(ref(db, 'p2p_v7'), { m: input.value, ts: Date.now() });
            input.value = '';
        }
    };

    onValue(ref(db, 'p2p_v7'), (snap) => {
        const data = snap.val();
        if (data) {
            Object.values(data).forEach(o => processSync(o.m, o.ts));
        }
    });

    renderUI();
</script>
</body>
</html>
