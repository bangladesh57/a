<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Private P2P Hub</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            background: #0b0b0b; color: #00ff00; font-family: 'Courier New', monospace; 
            margin: 0; display: flex; flex-direction: column; height: 100vh; height: -webkit-fill-available; overflow: hidden;
        }
        
        /* Fixed Top Search Bar */
        header { 
            padding: 10px; background: #1a1a1a; border-bottom: 2px solid #00ff00;
            display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        #search-input { 
            flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; 
            padding: 10px; outline: none; font-size: 14px;
        }

        /* Scrollable Message Area */
        main { 
            flex: 1; overflow-y: auto; padding: 15px; 
            display: flex; flex-direction: column; gap: 12px;
            background: #0b0b0b;
        }
        .msg-card {
            background: #161616; border: 1px solid #333; padding: 12px; border-radius: 8px;
        }
        .tag-row { font-size: 0.85em; margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
        .tag-btn { color: #00ff00; text-decoration: underline; cursor: pointer; font-weight: bold; }
        .content-text { word-wrap: break-word; line-height: 1.5; color: #e0e0e0; }

        /* Fixed Bottom Input Area */
        footer { 
            background: #111; border-top: 2px solid #00ff00;
            padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); 
            display: flex; gap: 8px; flex-shrink: 0;
        }
        #msgInput { 
            flex: 1; background: #000; border: 1px solid #00ff00; color: #00ff00; 
            padding: 12px; outline: none; font-size: 16px; border-radius: 4px;
        }
        #sendBtn { 
            background: #00ff00; color: #000; border: none; padding: 0 18px; 
            cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 15px;
        }

        /* Filter Info */
        #filter-info {
            background: #003300; padding: 6px 15px; font-size: 13px;
            display: none; justify-content: space-between; align-items: center;
        }
    </style>
</head>
<body>

<header>
    <input type="text" id="search-input" placeholder="Search #tags...">
    <button onclick="resetAll()" style="background:#444; color:#fff; border:none; padding:8px 12px; cursor:pointer; border-radius:4px;">Reset</button>
</header>

<div id="filter-info">
    <span id="active-tag"></span>
    <span onclick="resetAll()" style="cursor:pointer; color:#ff4444;">[Close]</span>
</div>

<main id="display-area"></main>

<footer>
    <input type="text" id="msgInput" placeholder="Write message with #tags..." autocomplete="off">
    <button id="sendBtn" onclick="transmit()">POST</button>
</footer>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

    const config = {
        apiKey: atob("QUl6YVN5QXd1SzJPX3YxbG8wWFZvLTlPekpiU1dJRkY2MXFqWTJB"),
        authDomain: atob("YmFuZ2xhZGVzaC00MjI1MS5maXJlYmFzZWFwcC5jb20="),
        databaseURL: atob("aHR0cHM6Ly9iYW5nbGFkZXNoLTQyMjUxLWRlZmF1bHQtcnRkYi5maXJlYmFzZWlvLmNvbQ=="),
        projectId: atob("YmFuZ2xhZGVzaC00MjI1MQ=="),
        appId: atob("MToxNzU1OTIwNjY0NDI6d2ViOjI2Yjg0NDM1YzZlZWNmMGI5NjhjNzM=")
    };

    const app = initializeApp(config);
    const db = getDatabase(app);
    let filterKey = null;

    const mainArea = document.getElementById('display-area');
    const searchInp = document.getElementById('search-input');

    window.setFilter = (t) => {
        filterKey = t.toLowerCase();
        document.getElementById('filter-info').style.display = 'flex';
        document.getElementById('active-tag').innerText = "Filter: " + t;
        refreshUI();
    };

    window.resetAll = () => {
        filterKey = null;
        searchInp.value = '';
        document.getElementById('filter-info').style.display = 'none';
        refreshUI();
    };

    searchInp.addEventListener('input', (e) => {
        const v = e.target.value.trim();
        if(v) setFilter(v); else resetAll();
    });

    const refreshUI = () => {
        const now = Date.now();
        let data = JSON.parse(localStorage.getItem('_app_cache')) || [];
        
        data = data.filter(i => i.expiry > now);
        localStorage.setItem('_app_cache', JSON.stringify(data));

        let viewData = data;
        if (filterKey) {
            viewData = data.filter(i => i.val.toLowerCase().includes(filterKey));
        }

        mainArea.innerHTML = viewData.map(i => {
            const tags = i.val.match(/#\w+/g) || [];
            const tagsHtml = tags.map(t => `<span class="tag-btn" onclick="setFilter('${t}')">${t}</span>`).join(' ');
            return `
                <div class="msg-card">
                    <div class="tag-row">${tagsHtml}</div>
                    <div class="content-text">${i.val}</div>
                </div>
            `;
        }).join('');
        
        mainArea.scrollTop = mainArea.scrollHeight;
    };

    const handleSync = (msg) => {
        let cache = JSON.parse(localStorage.getItem('_app_cache')) || [];
        if (!cache.some(c => c.val === msg)) {
            cache.push({ val: msg, expiry: Date.now() + 86400000 });
            localStorage.setItem('_app_cache', JSON.stringify(cache));
        }
        refreshUI();
    };

    window.transmit = () => {
        const inp = document.getElementById('msgInput');
        if (inp.value.trim()) {
            push(ref(db, 'p2p_v4'), { m: inp.value, ts: Date.now() });
            inp.value = '';
        }
    };

    onValue(ref(db, 'p2p_v4'), (s) => {
        const d = s.val();
        if (d) Object.values(d).forEach(o => handleSync(o.m));
    });

    refreshUI();
</script>
</body>
</html>
